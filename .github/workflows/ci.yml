name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff (linter)
        run: uv run --locked --python 3.12 ruff check hvac/

      - name: Mypy (type gate on calc core)
        run: uv run --locked --python 3.12 mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Qt system libraries (headless PySide6)
        # UI-тесты импортируют PySide6.QtWidgets. Даже под
        # QT_QPA_PLATFORM=offscreen Qt тянет libEGL/libGL/xkbcommon,
        # которых нет на голом ubuntu-раннере.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --python ${{ matrix.python-version }} python -m pytest tests/ -q
